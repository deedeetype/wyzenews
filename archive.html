<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Complete archive of WyzeNews daily digests - Breaking news in comic strip style" />
    <title>Archive - WyzeNews</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/assets/favicon.ico" sizes="any">

            <div id="full-archive" class="archive-container">
                <p style="text-align: center; color: #8b8ba7;">Loading archive...</p>
