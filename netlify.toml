# Only dist/ is published. It is produced by scripts/build.mjs from an explicit
# list of public files, so source code, docs and SQL never reach the website.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# No catch-all rewrite: unknown URLs get a real 404 (404.html).
# Security headers are generated into dist/_headers by the build script.

# Environment variables (set in the Netlify dashboard, never in this file):
#   SUPABASE_DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (functions only)
#   GMAIL_USER, GMAIL_APP_PASSWORD                    (functions only)
#   CONFIRM_SECRET                                    (functions only, signs opt-in links)
